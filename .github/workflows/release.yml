name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
  GRADLE_VERSION: '9.1.0'
  VERSION: '2.0.0'

jobs:
  candidate:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[candidate-release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Provision pinned PlexonCore ${CORE_VERSION}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar" \
            --output "libs/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  libs/PlexonCore-${CORE_VERSION}.jar" | sha256sum --check --strict
      - name: Build and verify candidate
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution writeSha256
      - name: Stage candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/libs/PlexonSkills-${VERSION}.jar" dist/
          cp build/distributions/SHA256SUMS.txt dist/
      - name: Publish immutable candidate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}-rc.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite immutable candidate assets." >&2
            exit 1
          fi
          gh release create "$tag" \
            "dist/PlexonSkills-${VERSION}.jar" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PlexonSkills ${VERSION} RC1" \
            --notes-file releases/2.0.0.md

  stable:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require exact stable version tag
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v${VERSION}" || { echo "Only exact v${VERSION} may publish stable ${VERSION}"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Provision pinned PlexonCore ${CORE_VERSION}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar" \
            --output "libs/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  libs/PlexonCore-${CORE_VERSION}.jar" | sha256sum --check --strict
      - name: Full stable verification
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution writeSha256
      - name: Stage stable release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "build/libs/PlexonSkills-${VERSION}.jar" dist/
          cp build/distributions/SHA256SUMS.txt dist/
      - name: Publish stable release without clobber
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Stable release already exists; refusing to clobber assets." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/PlexonSkills-${VERSION}.jar" dist/SHA256SUMS.txt \
            --title "PlexonSkills ${VERSION}" \
            --notes-file releases/2.0.0.md
