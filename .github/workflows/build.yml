name: Build

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

env:
  CORE_VERSION: '2.0.0'
  CORE_SHA256: '179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec'
  GRADLE_VERSION: '9.1.0'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Provision pinned PlexonCore 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          curl --fail --location --retry 3 \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar" \
            --output "libs/PlexonCore-${CORE_VERSION}.jar"
          echo "${CORE_SHA256}  libs/PlexonCore-${CORE_VERSION}.jar" | sha256sum --check --strict
      - name: Full verification
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution writeSha256
      - name: Stage distribution
        shell: bash
        run: |
          mkdir -p dist
          cp build/libs/PlexonSkills-1.0.0.jar dist/
          cp build/distributions/SHA256SUMS.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: PlexonSkills-1.0.0
          path: dist/*
          if-no-files-found: error
