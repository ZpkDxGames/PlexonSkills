name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACCEPTED_PHASE3_SHA: '44abed61931c508110fc9e50b16e8cf199324b61'
  ACCEPTED_RC2_SHA: 'fd1f15205353f91e42236865b8dd6141d46b3634'
  ROLLBACK_TAG: 'v2.0.0-rc.2'
  ROLLBACK_SHA: 'fd1f15205353f91e42236865b8dd6141d46b3634'
  ROLLBACK_JAR_SHA256: 'af31444e428d2f547ec9c8f5db49aaffeac4594efbe2c3c24e90e74dcb38bf07'
  CORE_VERSION: '2.0.4'
  CORE_SHA256: '61d625a717da9f46ee9231e1970d84b4c317ae12cf4090cdf7c9d39b6a1a9baf'
  GRADLE_VERSION: '9.1.0'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Provision immutable PlexonCore API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p libs
          core_jar="libs/PlexonCore-${CORE_VERSION}.jar"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v${CORE_VERSION}/PlexonCore-${CORE_VERSION}.jar" \
            --output "$core_jar"
          echo "${CORE_SHA256}  ${core_jar}" | sha256sum --check --strict

      - name: Resolve version and prove accepted lineage
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(gradle -q properties | sed -n 's/^version: //p')"
          test -n "$VERSION"
          git merge-base --is-ancestor "$ACCEPTED_PHASE3_SHA" HEAD
          git merge-base --is-ancestor "$ACCEPTED_RC2_SHA" HEAD
          grep -F 'paper-api:26.2.build.121-stable' build.gradle.kts
          grep -F 'PlexonCore-2.0.4.jar' build.gradle.kts
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Full source verification
        run: gradle --no-daemon clean test check javadoc shadowJar verifyDistribution writeSha256 --stacktrace

      - name: Verify tests and distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSkills-${VERSION}.jar"
          test -s "$JAR"
          mkdir -p build/release
          jar tf "$JAR" > build/release/JAR_CONTENTS.txt
          for entry in \
            plugin.yml \
            com/zpkdxgames/plexonskills/PlexonSkillsPlugin.class \
            com/zpkdxgames/plexonskills/api/PlexonSkillsAPI.class \
            com/zpkdxgames/plexonskills/ability/AbilityRuntime.class \
            com/zpkdxgames/plexonskills/player/PlayerSkillsService.class \
            com/zpkdxgames/plexonskills/persistence/SkillsRepository.class \
            com/zpkdxgames/plexonskills/runtime/CoreBlockSkillsRuntime.class \
            com/zpkdxgames/plexonskills/runtime/GameplayListener.class; do
            grep -qx "$entry" build/release/JAR_CONTENTS.txt
          done
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'org/bukkit/' \
            'io/papermc/' \
            'me/clip/placeholderapi/'; do
            if grep -q "^${prefix}" build/release/JAR_CONTENTS.txt; then
              echo "Provided API shaded into PlexonSkills: ${prefix}" >&2
              exit 1
            fi
          done
          unzip -p "$JAR" plugin.yml \
            | sed -n 's/^version:[[:space:]]*//p' \
            | head -n 1 | tr -d " '\"\r" | grep -qx "$VERSION"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonskills.PlexonSkillsPlugin | grep -q 'major version: 69'
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          paths = glob.glob('build/test-results/test/TEST-*.xml')
          if not paths:
              raise SystemExit('No JUnit XML results found')
          for path in paths:
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          if totals['tests'] <= 0:
              raise SystemExit('No tests executed')
          if totals['failures'] or totals['errors'] or totals['skipped']:
              raise SystemExit(f'Non-clean test totals: {totals}')
          with open('build/release/TEST_SUMMARY.txt','w',encoding='utf-8') as out:
              out.write(f"TEST_COUNT={totals['tests']} FAILURES={totals['failures']} ERRORS={totals['errors']} SKIPPED={totals['skipped']}\n")
          print(totals)
          PY
          cp build/distributions/SHA256SUMS.txt build/release/SHA256SUMS.txt
          (cd build/libs && sha256sum --check ../release/SHA256SUMS.txt)

      - name: Write exact provenance
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/PlexonSkills-${VERSION}.jar"
          digest="$(sha256sum "$JAR" | awk '{print $1}')"
          size="$(stat -c%s "$JAR")"
          cat > build/release/PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          source_sha=$GITHUB_SHA
          accepted_phase3=$ACCEPTED_PHASE3_SHA
          accepted_rc2=$ACCEPTED_RC2_SHA
          version=$VERSION
          java=25
          java_major=69
          paper=26.2.build.121-stable
          plexoncore=$CORE_VERSION
          plexoncore_sha256=$CORE_SHA256
          product_schema=2
          rollback_tag=$ROLLBACK_TAG
          rollback_sha=$ROLLBACK_SHA
          rollback_jar_sha256=$ROLLBACK_JAR_SHA256
          jar_size=$size
          jar_sha256=$digest
          ability_logout_cooldown=PRESERVED
          runtime_certification=NOT_EXECUTED
          EOF

      - name: Check source whitespace
        run: git diff --check origin/main...HEAD

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonSkills-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/libs/PlexonSkills-${{ steps.version.outputs.version }}.jar
            build/release/SHA256SUMS.txt
            build/release/TEST_SUMMARY.txt
            build/release/PROVENANCE.txt
          if-no-files-found: error
